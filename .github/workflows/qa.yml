name: B2B Admin QA

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      SKIP_DB: "true"
      AUTH_COOKIE_SECRET: ci-test-secret-at-least-32-characters-long
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Use Node.js 20
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"
      - name: Install dependencies without lockfile
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run production QA
        run: |
          rm -f .github/workflows/qa.yml
          npm run qa:production
